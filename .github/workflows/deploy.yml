name: Deploy vivos-admin-ui

on:
  push: { branches: [desa] }
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vivos-admin-ui

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_API_ID=${{ vars.VITE_API_ID || '22222222-2222-2222-2222-222222222222' }}
            VITE_ENABLE_MOCKS=${{ vars.VITE_ENABLE_MOCKS || 'false' }}
            VITE_TOKEN_REFRESH_INTERVAL_MS=${{ vars.VITE_TOKEN_REFRESH_INTERVAL_MS || '300000' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted   # runner del repo vivos-admin-ui en el servidor
    steps:
      - run: |
          cd /opt/infra/services/vivos-admin-ui
          docker compose pull
          docker compose up -d
          docker image prune -f
