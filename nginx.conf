server {
    listen 80;
    server_name _;

    # Se sirve detrás de Traefik bajo /vivo-admin (ver /opt/infra/services/vivos-admin-ui).
    location = /vivo-admin {
        return 301 /vivo-admin/;
    }

    location /vivo-admin/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /vivo-admin/index.html;
    }
}
